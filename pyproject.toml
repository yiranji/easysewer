[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easysewer"
version = "2.1.0"
authors = [
    {name = "Yiran Ji", email = "yiranji@foxmail.com"}
]
description = "An urban drainage modeling toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = []

[project.scripts]
easysewer = "easysewer.doctor:main"

[project.urls]
Homepage = "https://github.com/yiranji/easysewer"
Documentation = "https://github.com/yiranji/easysewer/blob/master/docs/README.md"
Source = "https://github.com/yiranji/easysewer"
Issues = "https://github.com/yiranji/easysewer/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["easysewer", "easysewer.*"]
namespaces = true

[tool.setuptools.package-data]
easysewer = [
    "libs/runtime-manifest.json",
    "libs/win/*.esdll",
    "libs/linux/*.esso",
    "libs/linux-aarch64/*.esso",
    "libs/macos-arm64/*.esso",
    "libs/win/*.json",
    "libs/linux/*.json",
    "libs/linux-aarch64/*.json",
    "libs/macos-arm64/*.json",
    "libs/*/.libs/*",
    "libs/licenses/*.txt",
    "libs/licenses/*.json"
]

[dependency-groups]
dev = [
    "notebook>=7.3.3",
    "plotly>=6.0.1",
]
