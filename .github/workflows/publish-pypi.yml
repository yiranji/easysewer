name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Final version to publish, for example 2.1.0'
        required: true
        type: string
      validation_run_id:
        description: 'Successful Release validation push run for this master commit'
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  prepare:
    name: Select validated release artifacts
    if: github.repository == 'yiranji/easysewer' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful validation of this exact master commit
        id: validation
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            const rawId = process.env.VALIDATION_RUN_ID;
            const version = process.env.RELEASE_VERSION;
            if (!/^[1-9][0-9]*$/.test(rawId) || !Number.isSafeInteger(Number(rawId))) {
              throw new Error('validation_run_id must be a positive integer');
            }
            if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version)) {
              throw new Error('Only final major.minor.patch versions may be published');
            }
            const runId = Number(rawId);
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: runId,
            });
            if (run.repository.full_name !== 'yiranji/easysewer' ||
                run.head_repository.full_name !== 'yiranji/easysewer' ||
                run.path !== '.github/workflows/release-validation.yml' ||
                run.event !== 'push' || run.head_branch !== 'master' ||
                run.head_sha !== context.sha || run.status !== 'completed' ||
                run.conclusion !== 'success') {
              throw new Error('Expected successful master push validation for ' + context.sha);
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: runId, per_page: 100,
            });
            const expected = ['release-source', 'native-windows-x86_64', 'native-linux-x86_64',
              'native-linux-aarch64', 'native-darwin-arm64'];
            const selected = expected.map(name => {
              const matches = artifacts.filter(a => a.name === name && !a.expired);
              if (matches.length !== 1) throw new Error('Expected exactly one unexpired ' + name);
              return matches[0].id;
            });
            core.setOutput('artifact_ids', selected.join(','));
            await core.summary.addRaw('Source commit: ' + context.sha + '\n\n')
              .addLink('Passing native platform and clean-baseline validation', run.html_url).write();
      - name: Download only the checked run's release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.validation.outputs.artifact_ids }}
          run-id: ${{ inputs.validation_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: packages
      - name: Verify final bytes and select four native wheels plus source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python packages/extract_sdist.py --archive packages/native/*.tar.gz --output source
          python source/*/tools/select_release_artifacts.py --packages packages \
            --version "$RELEASE_VERSION" --output pypi-dist | tee selected-files.json
          cat selected-files.json >> "$GITHUB_STEP_SUMMARY"
      - name: Save the exact distributions for the isolated publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pypi-distributions
          path: pypi-dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified distributions to PyPI
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/easysewer/
    permissions:
      id-token: write
    steps:
      - name: Download the prepared distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pypi-distributions
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

  verify:
    name: Verify PyPI installation / ${{ matrix.platform }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            architecture: x64
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            architecture: arm64
          - platform: darwin-arm64
            os: macos-15
            architecture: arm64
          - platform: windows-x86_64
            os: windows-2022
            architecture: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - name: Download the exact prepared distributions for comparison
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pypi-distributions
          path: expected
      - name: Verify all PyPI file hashes and download this native wheel
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ matrix.platform }}
        run: |
          mkdir -p evidence
          python tools/verify_pypi_release.py --expected expected --version "$RELEASE_VERSION" \
            --target "$RELEASE_TARGET" --output downloaded > evidence/pypi-files.json
      - name: Install only the downloaded PyPI wheel in a clean environment
        run: |
          python -m venv installed
          if [ "$RUNNER_OS" = Windows ]; then venv_python="$PWD/installed/Scripts/python.exe"; else venv_python="$PWD/installed/bin/python"; fi
          "$venv_python" -m pip install --no-index --no-deps --no-compile downloaded/*.whl
          echo "VENV_PY=$venv_python" >> "$GITHUB_ENV"
      - name: Check the installed version and native doctor smoke test
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          unset LD_LIBRARY_PATH LD_PRELOAD DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_INSERT_LIBRARIES
          "$VENV_PY" -I -c 'import os, easysewer, importlib.metadata as m; expected=os.environ["RELEASE_VERSION"]; assert easysewer.__version__ == m.version("easysewer") == expected'
          "$VENV_PY" -I -m easysewer doctor --json > evidence/doctor-load.json
          "$VENV_PY" -I -m easysewer doctor --json --smoke-test > evidence/doctor-smoke.json
      - name: Save publication verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pypi-install-${{ matrix.platform }}
          path: evidence/*.json
          if-no-files-found: ignore
          retention-days: 14
